<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" class="w-full h-full">
  <!-- Outer Chronometer Gear Ring -->
  <circle cx="50" cy="50" r="46" stroke="#C6A15B" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="50" cy="50" r="42" stroke="#1C1C18" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="39" stroke="#C6A15B" stroke-width="0.8"/>

  <!-- Hour markers / Tick accents -->
  <line x1="50" y1="9" x2="50" y2="13" stroke="#C6A15B" stroke-width="2"/>
  <line x1="50" y1="87" x2="50" y2="91" stroke="#C6A15B" stroke-width="2"/>
  <line x1="9" y1="50" x2="13" y2="50" stroke="#C6A15B" stroke-width="2"/>
  <line x1="87" y1="50" x2="91" y2="50" stroke="#C6A15B" stroke-width="2"/>

  <!-- Tourbillon Cage & Balance Wheel Geometry -->
  <g transform="translate(50, 50)">
    <!-- Rotating escapement bridge -->
    <path d="M-18,-6 L18,-6 L14,6 L-14,6 Z" fill="#C6A15B" fill-opacity="0.2" stroke="#C6A15B" stroke-width="1"/>
    <!-- Interlocking TIMELESS T Monogram -->
    <path d="M-16,-18 L16,-18 L16,-13 L3,-13 L3,18 L-3,18 L-3,-13 L-16,-13 Z" fill="#1C1C18"/>
    <!-- Central Jewel Pip -->
    <circle cx="0" cy="0" r="4.5" fill="#775A1A" stroke="#C6A15B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    <!-- Gold Crown Crest Accents -->
    <path d="M-10,-24 L-7,-20 L0,-26 L7,-20 L10,-24 L8,-19 L-8,-19 Z" fill="#C6A15B"/>
  </g>
</svg>
